<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#15331F"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#E0661F"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#FFFFFF"/>

  <!-- 列の見出し -->
  <g font-size="22" font-weight="700" fill="#15331F" text-anchor="middle">
    <text x="135" y="40">入力</text>
    <text x="460" y="40">処理</text>
    <text x="785" y="40">出力</text>
  </g>

  <!-- 入力 -->
  <g stroke="#15331F" stroke-width="3" fill="#E6F4DC">
    <rect x="20" y="70" width="230" height="74" rx="12"/>
    <rect x="20" y="180" width="230" height="74" rx="12"/>
    <rect x="20" y="290" width="230" height="74" rx="12"/>
  </g>
  <g fill="#15331F" text-anchor="middle">
    <text x="135" y="101" font-size="19" font-weight="700">可変抵抗 ×3</text>
    <text x="135" y="127" font-size="15">赤・緑・青のつまみ</text>
    <text x="135" y="211" font-size="19" font-weight="700">スタートボタン</text>
    <text x="135" y="237" font-size="15">ゲームを始める</text>
    <text x="135" y="321" font-size="19" font-weight="700">決定ボタン</text>
    <text x="135" y="347" font-size="15">色を決めて採点する</text>
  </g>

  <!-- 処理 -->
  <rect x="345" y="70" width="230" height="294" rx="14" fill="#BFE8C4" stroke="#15331F" stroke-width="3"/>
  <g fill="#15331F" text-anchor="middle">
    <text x="460" y="108" font-size="22" font-weight="700">Arduino Uno</text>
    <text x="460" y="134" font-size="15">（マイコン）</text>
  </g>
  <line x1="365" y1="150" x2="555" y2="150" stroke="#15331F" stroke-width="1.5"/>
  <g fill="#15331F" font-size="15">
    <text x="368" y="182">① 電圧をAD変換で読む</text>
    <text x="368" y="208">　 0〜1023 → 0〜255</text>
    <text x="368" y="242">② LEDに色を送る</text>
    <text x="368" y="276">③ お題との色の距離を</text>
    <text x="368" y="300">　 計算して点数にする</text>
    <text x="368" y="334">④ 30秒タイマー</text>
  </g>

  <!-- 出力 -->
  <g stroke="#15331F" stroke-width="3" fill="#FFF4C2">
    <rect x="670" y="56" width="230" height="66" rx="12"/>
    <rect x="670" y="140" width="230" height="66" rx="12"/>
    <rect x="670" y="224" width="230" height="66" rx="12"/>
    <rect x="670" y="308" width="230" height="66" rx="12"/>
  </g>
  <g fill="#15331F" text-anchor="middle">
    <text x="785" y="84" font-size="18" font-weight="700">フルカラーLED ×60</text>
    <text x="785" y="108" font-size="14">カメレオンの体</text>
    <text x="785" y="168" font-size="18" font-weight="700">フルカラーLED ×24</text>
    <text x="785" y="192" font-size="14">背景パネル（お題の色）</text>
    <text x="785" y="252" font-size="18" font-weight="700">液晶ディスプレイ</text>
    <text x="785" y="276" font-size="14">点数・残り時間</text>
    <text x="785" y="336" font-size="18" font-weight="700">圧電ブザー</text>
    <text x="785" y="360" font-size="14">効果音</text>
  </g>

  <!-- 信号の流れ -->
  <g stroke="#15331F" stroke-width="2.5" marker-end="url(#a)">
    <line x1="250" y1="107" x2="343" y2="107"/>
    <line x1="250" y1="217" x2="343" y2="217"/>
    <line x1="250" y1="327" x2="343" y2="327"/>
    <line x1="575" y1="78" x2="668" y2="78"/>
    <line x1="575" y1="162" x2="668" y2="162"/>
    <line x1="575" y1="257" x2="668" y2="257"/>
    <line x1="575" y1="341" x2="668" y2="341"/>
  </g>
  <g fill="#15331F" font-size="13" text-anchor="middle">
    <text x="297" y="99">電圧 0〜5V</text>
    <text x="297" y="209">ON / OFF</text>
    <text x="297" y="319">ON / OFF</text>
    <text x="621" y="70">色のデータ</text>
    <text x="621" y="154">色のデータ</text>
    <text x="621" y="249">I²C通信</text>
    <text x="621" y="333">PWM</text>
  </g>

  <!-- 電源 -->
  <rect x="345" y="430" width="230" height="70" rx="12" fill="#FFE3CF" stroke="#E0661F" stroke-width="3"/>
  <g fill="#15331F" text-anchor="middle">
    <text x="460" y="461" font-size="19" font-weight="700">ACアダプタ 5V 6A</text>
    <text x="460" y="485" font-size="14">電源</text>
  </g>
  <g fill="none" stroke="#E0661F" stroke-width="2.5" stroke-dasharray="8 5">
    <path d="M460 430 V366" marker-end="url(#p)"/>
    <path d="M575 465 H912 V89 H903" marker-end="url(#p)"/>
    <path d="M912 173 H903" marker-end="url(#p)"/>
  </g>
  <text x="895" y="440" font-size="13" fill="#B4501A" text-anchor="end">LEDには電源から直接電気を送る</text>

  <!-- 凡例 -->
  <g font-size="14" fill="#15331F">
    <line x1="24" y1="530" x2="74" y2="530" stroke="#15331F" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="84" y="535">信号の流れ</text>
    <line x1="194" y1="530" x2="244" y2="530" stroke="#E0661F" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#p)"/>
    <text x="254" y="535">電気（電源）の流れ</text>
  </g>
</svg>
